async function sqAdd(tk){tk=String(tk||'').trim().toUpperCase();if(!DB||!OWNER||!SQRE.test(tk))return;const r=S.research[tk];if(r&&!/완료|폐기|실패/.test(r.status||'')){toast(`${tk}는 이미 조사 대기에 있습니다 (${r.status||'대기'})`);return;}
